<script>// ===================== SUPABASE BACKEND SHIM (GitHub Pages build) =====================
// Provides window.claude.use('db'|'user'|'room'|'comments') on top of Supabase so the game code runs unchanged.
(function(){
if(window.claude&&window.claude.use)return;
const SB_URL='https://qrxfmymmsjsyzhvuudtj.supabase.co',SB_KEY='sb_publishable_2r38ph8nVKDipJLgkwp-AA_QgTP66Go';
let sb=null,uid=null,admin=false,ready=null,authErr='';
const split=p=>{const s=String(p).split('/');const id=s.pop();return [s.join('/'),id];};
function init(){if(ready)return ready;ready=(async()=>{
  if(!window.supabase||!window.supabase.createClient){authErr='โหลดระบบออนไลน์ไม่สำเร็จ';return false;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},realtime:{params:{eventsPerSecond:10}}});
  window.SBC=sb;
  try{let {data}=await sb.auth.getSession();let s=data&&data.session;
    if(!s){const r=await sb.auth.signInAnonymously();if(r.error){authErr=r.error.message||'เข้าสู่ระบบไม่สำเร็จ';return false;}s=r.data.session;}
    uid=s.user.id;window.SBUSER=s.user;try{const pv=localStorage.getItem('aether-uid');if(pv&&pv!==uid){window.SB_SWITCHED=true;try{const old=localStorage.getItem('aether-trail-v1');if(old)localStorage.setItem('aether-trail-v1-guest',old);}catch(e){}}localStorage.setItem('aether-uid',uid);}catch(e){}
    try{const a=await sb.from('admins').select('uid').eq('uid',uid).maybeSingle();admin=!!(a.data);}catch(e){}
    sb.auth.onAuthStateChange((ev,ss)=>{if(ss&&ss.user)window.SBUSER=ss.user;if(ss&&ss.user&&ss.user.id!==uid){location.reload();}});
    return true;}catch(e){authErr=String(e&&e.message||e);return false;}})();return ready;}
// ---- realtime fan-out for docs table
const subs={};let rtCh=null;
function rtStart(){if(rtCh||!sb)return;rtCh=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const r=p.new&&p.new.col?p.new:p.old||{};const c=r.col;(subs[c]||[]).forEach(f=>{try{f(r.id);}catch(e){}});}).subscribe();}
function sub(col,f){(subs[col]=subs[col]||[]).push(f);rtStart();return()=>{subs[col]=(subs[col]||[]).filter(x=>x!==f);};}
const snapDoc=(id,data)=>({id,exists:data!=null,data:()=>data==null?undefined:JSON.parse(JSON.stringify(data))});
function docRef(path){const [col,id]=split(path);return {
  id,async get(){const {data,error}=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(error)throw error;return snapDoc(id,data?data.data:null);},
  async set(obj){const {error}=await sb.from('docs').upsert({col,id,data:obj||{}});if(error)throw error;},
  async update(obj){const cur=await this.get();const {error}=await sb.from('docs').upsert({col,id,data:{...(cur.data()||{}),...obj}});if(error)throw error;},
  async delete(){const {error}=await sb.from('docs').delete().eq('col',col).eq('id',id);if(error)throw error;},
  onSnapshot(cb,err){let t=null,live=true;const run=()=>this.get().then(s=>{if(live)cb(s);},e=>err&&err(e));run();const un=sub(col,i=>{if(i!==id)return;clearTimeout(t);t=setTimeout(run,250);});return()=>{live=false;un();};}};}
function query(col,o){o=o||{};const q={
  limit(n){return query(col,{...o,lim:n});},orderBy(f,d){return query(col,{...o,ob:[f,d]});},where(f,op,v){return query(col,{...o,wh:[f,op,v]});},
  doc(id){return docRef(col+'/'+id);},
  async get(){let r=sb.from('docs').select('id,data').eq('col',col);
    if(o.wh&&o.wh[1]==='array-contains')r=r.contains('data',{[o.wh[0]]:[o.wh[2]]});else if(o.wh&&o.wh[1]==='==')r=r.eq('data->>'+o.wh[0],String(o.wh[2]));
    if(o.ob)r=r.order('data->'+o.ob[0],{ascending:o.ob[1]!=='desc'});r=r.limit(o.lim||1000);
    const {data,error}=await r;if(error)throw error;const docs=(data||[]).map(x=>snapDoc(x.id,x.data));return {docs,size:docs.length,empty:!docs.length};},
  onSnapshot(cb,err){let t=null,live=true;const run=()=>this.get().then(s=>{if(live)cb(s);},e=>err&&err(e));run();const un=sub(col,()=>{clearTimeout(t);t=setTimeout(run,400);});return()=>{live=false;un();};}};return q;}
const DBNS={doc:docRef,collection:c=>query(c)};
const USERNS={id:async()=>uid,me:async()=>({id:uid,name:''}),isOwner:()=>admin,canEdit:()=>admin,can:()=>true,profiles:async()=>({}),search:async()=>[]};
// ---- presence room (Supabase Realtime presence)
function mkRoom(){const key=Math.random().toString(36).slice(2,12);let state={},handlers=[],peers=Object.freeze([]),ch=null,pend=null;
  const build=()=>{const ps=ch.presenceState();const out=[];for(const k in ps){const m=ps[k]&&ps[k][ps[k].length-1];if(!m)continue;const {by,...p}=m;delete p.presence_ref;out.push({peer:k,by:by||null,isMe:k===key||(by&&by===uid),sameTab:k===key,kind:'viewer',guest:false,presence:p.st||{},updatedAt:Date.now()});}peers=Object.freeze(out);handlers.forEach(h=>{try{h({peers,joined:[],left:[],updated:out});}catch(e){}});};
  ch=sb.channel('town',{config:{presence:{key}}});ch.on('presence',{event:'sync'},build).subscribe(s=>{if(s==='SUBSCRIBED')ch.track({by:uid,st:state});});
  return {presence(patch){for(const k in patch){if(patch[k]===null)delete state[k];else state[k]=patch[k];}clearTimeout(pend);pend=setTimeout(()=>{try{ch.track({by:uid,st:state});}catch(e){}},120);return Promise.resolve();},
    onPeers(h){handlers.push(h);setTimeout(()=>h({peers,joined:peers,left:[],updated:[]}),0);return()=>{handlers=handlers.filter(x=>x!==h);};},peers:()=>peers,
    emit(){return Promise.resolve();},on(){return()=>{};}};}
let ROOMNS=null;
window.claude={use:async name=>{const ok=await init();if(!ok)return null;
  if(name==='db')return DBNS;if(name==='user')return USERNS;if(name==='room'){if(!ROOMNS)ROOMNS=mkRoom();return ROOMNS;}return null;}};
window.SB_STATUS=()=>({ok:!!uid,err:authErr,anon:!!(window.SBUSER&&window.SBUSER.is_anonymous),email:window.SBUSER&&window.SBUSER.email||''});
window.SB_LINK=async email=>{await init();const {error}=await sb.auth.updateUser({email},{emailRedirectTo:location.origin+location.pathname});return error?error.message:'';};
window.SB_LOGIN=async email=>{await init();const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});return error?error.message:'';};
init();
})();
</script>

<style>
/* Layout: phone-shaped column — teal-framed header, one screen at a time, teal tab bar; parchment and gold storybook world */

/* header */
.top{background:linear-gradient(180deg,var(--teal2),var(--teal));border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));color:#fff}

  text-shadow:0 2px 0 #5a2a16,1px 0 0 #5a2a16,-1px 0 0 #5a2a16,0 -1px 0 #5a2a16}

/* ---------- panels ---------- */
.head{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 10px 8px;font-family:var(--f-head);font-weight:700;font-size:20px;color:var(--teal)}

.card{background:#fffaf0;border:1.5px solid var(--parch3);border-radius:12px;padding:12px;box-shadow:0 1px 0 #fff inset}

.btn{font-size:15px;color:#fff;background:linear-gradient(180deg,var(--tealL),var(--teal) 60%,var(--tealD));border:2px solid var(--gold);border-radius:24px;padding:9px 18px;box-shadow:0 3px 0 #0c2220;display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* party */
.formation{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--gold);background:linear-gradient(180deg,#9fc98a,#7fae6a);padding:10px 8px 12px}
.row{display:grid;gap:8px}
.row.front{grid-template-columns:repeat(2,1fr);margin:0 14%}
.row.back{grid-template-columns:repeat(3,1fr);margin-top:8px}
.rowlbl{font-family:var(--f-head);font-weight:700;font-size:12px;color:#fff;text-shadow:0 1px 2px #0008;text-align:center;margin:2px 0 4px}
.slot{aspect-ratio:1/1.05;max-width:100%;border-radius:50% 50% 12px 12px/30% 30% 12px 12px;background:radial-gradient(ellipse at 50% 85%,#e9e1cc 0 42%,#c9bd9c 43% 48%,transparent 49%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;border:2px dashed transparent}
.slot img{height:76%;width:auto;max-width:100%;object-fit:contain;margin-bottom:12%}
.slot .nm{position:absolute;bottom:2px;font-size:11px;font-family:var(--f-head);font-weight:700;background:#14332fd8;color:#fff;border-radius:8px;padding:0 7px;white-space:nowrap}
.slot.empty{border-color:#ffffff90}
.slot.empty .nm{background:#ffffff70;color:var(--teal)}
.slot.sel{border-color:var(--gold2);background-color:#fff6;box-shadow:0 0 0 2px var(--gold2)}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:10px;background:#fff1d6;border:1px solid #e9c86d}
.warn.bad{background:#fde4dc;border-color:#e7a08d}
.warn.good{background:#e3f4dc;border-color:#9fd08a}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rl{display:flex;gap:8px;align-items:center;font-size:12px}
.rl .ic{width:28px;height:28px;border-radius:50%;background:var(--teal);border:1.5px solid var(--gold2);display:grid;place-items:center;flex:none}
.rl .ic svg{width:15px;height:15px;fill:#fff}
.rl b{font-family:var(--f-head);font-size:13px;display:block;line-height:1.2}

/* hero */
.hero-top{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:linear-gradient(180deg,#d9ecf0,#efe6cc 70%);border-bottom:2px solid var(--gold);padding:8px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}

.hname{display:flex;gap:10px;align-items:center}

.hname b{font-family:var(--f-head);font-size:22px;line-height:1.1;display:block}
.lvline{display:flex;justify-content:space-between;font-family:var(--f-head);font-weight:600}

.stats{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:22px 1fr auto 64px;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--parch3)}

  const x0=from.cx+18,y0=from.cy-6,x1=to.cx,y1=to.cy;let dur=Math.max(160,Math.hypot(x1-x0,y1-y0)*1.4)/speed;if(!isFinite(dur)||dur<0)dur=300;
  let d;if(kind==='arrow'){d=fxEl('arrow',x0,y0);const ang=Math.atan2(y1-y0,x1-x0);d.style.marginLeft='-30px';d.style.transform=`rotate(${ang}rad)`;
    d.animate([{left:x0+'px',top:y0+'px'},{left:x1+'px',top:y1+'px'}],{duration:dur,easing:'linear'}).onfinish=()=>{d.remove();cb();};return;}
  const c=kind==='heal'?'#7dffa0':kind==='orb'?'#8fd3ff':'#ffe27a';d=fxEl('proj',x0,y0,{background:`radial-gradient(circle,#fff 0 25%,${c} 45%,transparent 72%)`,width:'22px',height:'22px',boxShadow:`0 0 12px ${c}`});
  d.animate([{left:x0+'px',top:y0+'px'},{left:x1+'px',top:(y1-(kind==='heal'?30:0))+'px'}],{duration:dur*1.1,easing:'ease-in'}).onfinish=()=>{d.remove();cb();};}
function lunge(u,dir){u.spr.animate([{transform:'translateX(0)'},{transform:`translateX(${dir*16}px)`},{transform:'translateX(0)'}],{duration:240/speed});}
function hitFlash(u){const im=u.spr.querySelector('img');im.classList.remove('flash');void im.offsetWidth;im.classList.add('flash');

function banner(t,s){stage.querySelectorAll('.banner').forEach(b=>b.remove());const b=document.createElement('div');b.className='banner';b.innerHTML=`<b>${t}</b>${s?`<span>${s}</span>`:''}`;stage.appendChild(b);setTimeout(()=>b.remove(),1850);}

function dealTo(e,mult,src,label){
  if(!e.alive||B.over)return;
  const crit=Math.random()*100<src.crit;let d=src.atk*mult*100/(100+e.def)*rnd(.92,1.08);if(crit)d*=1.6;
  const magic=src.rl==='mage'||src.rl==='healer';if(B.mod==='antimagic'&&magic)d*=.4;if(B.mod==='armor'&&!magic)d*=.5;d=Math.max(1,Math.round(d));
  if(e.shield>0){const a=Math.min(e.shield,d);e.shield-=a;d-=a;if(a)dmgNum(e,'โล่ -'+kf(a),'hurt');if(d<=0){hitFlash(e);return;}}
  e.hp-=d;src.dealt+=d;dmgNum(e,kf(d),crit?'crit':'');hitFlash(e);sparks(e.cx,e.cy,crit?'#ffe27a':'#fff',crit?8:4);
  if(B.daily&&e.hp<=0){e.hp+=e.max;B.phase++;dmgNum(e,'หลอดที่ '+B.phase,'sk');return;}
  if(e.hp<=0)killEnemy(e);
}
function heal(t,amt,src){if(!t.alive)return;if(B&&B.mod==='noheal')amt*=.3;const a=Math.min(Math.round(amt),t.max-t.hp);if(a<=0)return;t.hp+=a;src.healed+=a;dmgNum(t,'+'+kf(a),'heal');sparks(t.cx,t.cy,'#7dffa0',5);}
function killEnemy(e){e.alive=false;e.el.classList.add('dead');if(B.pvp)return;const s=B.s;
  const g=Math.round(goldKill(s)*(e.kind==='mid'?1.5:e.kind==='boss'?12:1)*gMul()),x=Math.round(expKill(s)*(e.kind==='mid'?1.5:e.kind==='boss'?12:1)*xMul());
  S.gold+=g+x;let m=0;if(Math.random()<(e.kind==='boss'?1:.12))m=e.kind==='boss'?6+Math.floor(s/2):1;S.mats+=m;B.loot.g+=g+x;B.loot.m+=m;
  dmgNum(e,`+${kf(g)} ทอง`,'sk');}
const alive=a=>a.filter(u=>u.alive);
function heroAct(h){
  const en=alive(B.en);if(!en.length)return;const H=HEROES[h.k],k=H.rl,m=skMult(rkOf(h.k)),P0=H.sk,P={...P0,x:P0.x&&P0.x*m,sh:P0.sh&&P0.sh*m,hl:P0.hl&&P0.hl*m,al:P0.al&&P0.al*m};
  const front=en.slice().sort((a,b)=>a.pos[0]-b.pos[0])[0];
  if(h.skT<=0){
    h.skT=H.sk.cd;h.el.classList.add('cast');dmgNum(h,H.sk.n,'sk');v3Skill(h,H);
    if(k==='knight'){h.shield=Math.round(h.max*P.sh);B.taunt=P.tt;B.tauntBy=h;burst(h.cx,h.cy,60,'#8fd3ff');}
    else if(k==='ranger'){lunge(h,-1);if((P.c||1)===1){const t=en.slice().sort((a,b)=>a.hp-b.hp)[0];shoot(h,t,'arrow',()=>{burst(t.cx,t.cy,40,'#c8ff9a');dealTo(t,P.x,h);});}
      else for(let i=0;i<P.c;i++)setTimeout(()=>{const ae=alive(B.en);if(!ae.length)return;const t=pick(ae);shoot(h,t,'arrow',()=>{burst(t.cx,t.cy,26,'#c8ff9a',300);dealTo(t,P.x,h);});},i*110/speed);}
    else if(k==='mage'){burst(h.cx,h.cy,40,'#8fd3ff');en.forEach((t,i)=>setTimeout(()=>{if(!t.alive)return;const d=fxEl('proj',t.cx-60,t.cy-180,{width:'30px',height:'30px',background:'radial-gradient(circle,#fff 0 25%,#ffe27a 45%,transparent 72%)',boxShadow:'0 0 18px #ffd86b'});
      d.animate([{left:(t.cx-60)+'px',top:(t.cy-180)+'px'},{left:t.cx+'px',top:t.cy+'px'}],{duration:320/speed,easing:'ease-in'}).onfinish=()=>{d.remove();burst(t.cx,t.cy,55,'#ffd86b');dealTo(t,P.x,h);};},i*90/speed));}
    else{const tgt=alive(B.heroes).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];burst(tgt.cx,tgt.cy,70,'#7dffa0',700);heal(tgt,tgt.max*P.hl,h);alive(B.heroes).forEach(o=>{if(o!==tgt)heal(o,o.max*P.al,h);});}
    return;
  }
  if(h.atkT>0)return;h.atkT=h.spd;
  if(k==='knight'){lunge(h,1);slash(front,'#ffe9a8');setTimeout(()=>dealTo(front,1,h),90/speed);}
  else if(k==='ranger'){lunge(h,-1);const t=pick(en);shoot(h,t,'arrow',()=>dealTo(t,1,h));}
  else if(k==='mage'){const t=pick(en);shoot(h,t,'orb',()=>{burst(t.cx,t.cy,26,'#8fd3ff',300);dealTo(t,1,h);});}
  else{const low=alive(B.heroes).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];
    if(low&&low.hp/low.max<.88)shoot(h,low,'heal',()=>heal(low,h.atk*2.4,h));else{const t=pick(en);shoot(h,t,'orb',()=>dealTo(t,1,h));}}
}
function enemyAct(e){
  const hs=alive(B.heroes);if(!hs.length)return;e.atkT=e.spd;e.hits++;
  if(e.kind==='pvp'&&e.hits%4===0){const H=HEROES[e.k];lunge(e,-1);dmgNum(e,H.sk.n,'sk');
    if(e.rl==='knight'){e.shield=Math.round(e.max*.25);burst(e.cx,e.cy,60,'#8fd3ff');}
    else if(e.rl==='ranger'){const t=hs.slice().sort((a,b)=>a.hp-b.hp)[0];burst(t.cx,t.cy,40,'#c8ff9a');hurt(t,e,3);}
    else if(e.rl==='mage'){burst(SW*.3,SH*.75,SW*.35,'#ffd86b',600);hs.forEach(h=>hurt(h,e,1.4));}
    else{const al=alive(B.en).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];const a=Math.round(al.max*.3);al.hp=Math.min(al.max,al.hp+a);dmgNum(al,'+'+kf(a),'heal');burst(al.cx,al.cy,60,'#7dffa0');}
    return;}
  if(e.kind==='pvp'&&e.rl==='healer'){const al=alive(B.en).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(al&&al.hp/al.max<.8){const a=Math.round(e.atk*2.4);al.hp=Math.min(al.max,al.hp+a);dmgNum(al,'+'+kf(a),'heal');return;}}
  if(e.kind==='boss'&&B.tower&&e.hits%3===0){lunge(e,-1);burst(SW*.3,SH*.75,SW*.35,'#ff8a5a',600);dmgNum(e,'ทุบพื้น','sk');hs.forEach(h=>hurt(h,e,.6));return;}
  let t;const kn=B.tauntBy;
  if(B.taunt>0&&kn&&kn.alive)t=kn;else{const fr=hs.filter(h=>h.front);t=fr.length?pick(fr):pick(hs);}
  lunge(e,-1);setTimeout(()=>hurt(t,e,1),110/speed);
}
function bossAbility(e){const ab=BOSSAB[B.area]||BOSSAB[0],hs=alive(B.heroes);if(!hs.length)return;e.abT=8;lunge(e,-1);dmgNum(e,ab.n,'sk');
  if(ab.k==='shield'){e.shield=Math.round(e.max*.2);burst(e.cx,e.cy,90,'#c8ff9a',700);}
  else if(ab.k==='cleave'){burst(SW*.3,SH*.75,SW*.38,'#ffb36b',600);hs.forEach(h=>hurt(h,e,1.2));}
  else if(ab.k==='poison'){const fr=hs.filter(h=>h.front);(fr.length?fr:hs).forEach(h=>{h.pois=4;h.poisDmg=e.atk*.35;burst(h.cx,h.cy,50,'#b56bff',600);});}
  else if(ab.k==='heal'){const a=Math.round(e.max*.12);e.hp=Math.min(e.max,e.hp+a);dmgNum(e,'+'+kf(a),'heal');burst(e.cx,e.cy,100,'#e9d6ff',700);}
  else if(ab.k==='chill'){burst(SW*.3,SH*.75,SW*.4,'#bfe6ff',700);hs.forEach(h=>{hurt(h,e,1);h.chill=4;});}
  else if(ab.k==='burn'){burst(SW*.3,SH*.75,SW*.4,'#ffb347',700);hs.forEach(h=>{hurt(h,e,.8);h.pois=4;h.poisDmg=e.atk*.2;});}
  else if(ab.k==='storm'){const bk=hs.filter(h=>!h.front),tg=bk.length?bk:hs;for(let i=0;i<3;i++){const h=tg[i%tg.length];if(!h.alive)continue;burst(h.cx,h.cy,60,'#e6f2ff',500);hurt(h,e,1.6);}}
  else if(ab.k==='eclipse'){burst(SW*.3,SH*.75,SW*.42,'#9a6bff',800);hs.forEach(h=>hurt(h,e,1.1));const a=Math.round(e.max*.06);e.hp=Math.min(e.max,e.hp+a);e.shield=Math.round(e.max*.1);dmgNum(e,'+'+kf(a),'heal');}}
function stageIntro(st){if(!S.set.fx&&false)return;const im=stagePanel(st);if(!im)return;stage.querySelectorAll('.introv').forEach(x=>x.remove());const d=document.createElement('div');d.className='introv';
  d.innerHTML=`<img src="${im}" alt=""><span>${sname(st)} · ${AREAS[Math.floor(st/10)].n}</span>`;stage.appendChild(d);setTimeout(()=>d.remove(),2300);}
function hurt(h,e,mult){if(!h.alive||B.over)return;let d=Math.max(1,Math.round(e.atk*mult*100/(100+h.def)*rnd(.9,1.1)));
  if(h.shield>0){const a=Math.min(h.shield,d);h.shield-=a;d-=a;if(a)dmgNum(h,'โล่ -'+kf(a),'hurt');}
  if(d<=0)return;h.hp-=d;h.taken+=d;dmgNum(h,'-'+kf(d),'hurt');hitFlash(h);
  if(h.hp<=0){h.hp=0;h.alive=false;h.diedAt=B.t;h.el.classList.add('down');}}

function tick(dt){
  if(!B||B.over)return;
  dt*=speed;B.t+=dt;B.taunt=Math.max(0,B.taunt-dt);
  if(B.mod==='poison')B.heroes.forEach(h=>{if(!h.alive)return;h.hp-=h.max*.015*dt;h.taken+=h.max*.015*dt;if(h.hp<=0){h.hp=0;h.alive=false;h.diedAt=B.t;h.el.classList.add('down');}});
  B.heroes.forEach(h=>{if(!h.alive)return;
    if(h.pois>0){const t=Math.min(dt,h.pois);h.pois-=dt;const pd=h.poisDmg*t*100/(100+h.def);h.hp-=pd;h.taken+=pd;if(h.hp<=0){h.hp=0;h.alive=false;h.diedAt=B.t;h.el.classList.add('down');return;}}
    if(h.chill>0){h.chill-=dt;h.atkT-=dt/1.3;}else h.atkT-=dt;h.skT-=dt;heroAct(h);});
  petTick(dt);
  B.en.forEach(e=>{if(!e.alive)return;e.atkT-=dt;if(e.atkT<=0)enemyAct(e);if(e.kind==='boss'&&!B.tower){e.abT-=dt;if(e.abT<=0)bossAbility(e);}});
  // bars
  B.heroes.concat(B.en).forEach(u=>{u.hpI.style.width=clamp(u.hp/u.max*100,0,100)+'%';if(u.shI)u.shI.style.width=clamp((u.shield||0)/u.max*100,0,100)+'%';});
  B.heroes.forEach(kn=>{if(kn.rl!=='knight')return;const has=kn.shield>0;let bub=kn.el.querySelector('.bub');if(has&&!bub){kn.spr.insertAdjacentHTML('beforeend','<div class="bub"></div>');}if(!has&&bub)bub.remove();});
  if(B.daily)$('modTag').textContent='👑 ดาเมจรวม '+kf(B.heroes.reduce((a,h)=>a+h.dealt,0))+' · หลอดที่ '+B.phase;
  $('timer').textContent=`${B.tower?'หอคอย':B.boss?'บอส':'คลื่นศัตรู'} · ${Math.max(0,Math.ceil(B.limit-B.t))} วิ`;
  if(!alive(B.en).length)endWave(true);
  else if(!alive(B.heroes).length)endWave(false,'wipe');
  else if(B.t>=B.limit)endWave(false,'time');
}
function endWave(win,why){
  B.over=true;const s=S.stage,was=B.boss;
  if(B.tower){towerEnd(win,why);save();return;}
  if(B.pvp){pvpEnd(win,why);save();return;}
  if(B.daily){dailyEnd();return;}
  if(B.dun){dunEnd(win,why);return;}
  if(win){
    if(was)weekRun();
    const first=!S.firsts[s],cg=Math.round(goldKill(s)*(was?30:6)*(first?1:.2)*gMul()),cx=Math.round(expKill(s)*(was?30:6)*(first?1:.2)*xMul());S.gold+=cg+cx;B.loot.g+=cg+cx;
    if(first&&was){petEggDrop('ปราบบอสครั้งแรก');S.form.filter(Boolean).forEach(k=>{S.h[k].eq.w++;});B.loot.gear=1;S.soul=(S.soul||0)+2;}
    if(!S.firsts[s]){S.firsts[s]=1;const gm=was?50:10;S.gems+=gm;B.loot.gem=gm;if(was&&S.gUnlocked){S.tickets+=3;setTimeout(()=>toast('ผ่านบอสครั้งแรก +3 ตั๋วดาว'),2600);}if(!was)setTimeout(()=>toast(`ผ่านด่าน ${sname(s)} ครั้งแรก +${gm} คริสตัล`),500);}
    S.best=Math.max(S.best,s+1);
    if(was){banner('VICTORY!',`ปราบ${AREAS[Math.floor(s/10)].boss}`);const L={...B.loot};
      if(s+1<STAGES)S.stage=s+1;
      setTimeout(()=>showVictory({title:'ชัยชนะ!',sub:`ปราบ${AREAS[Math.floor(s/10)].boss}สำเร็จ`+(L.gear?' · ได้อาวุธบอส: อาวุธทุกคนในทีม +1 · ผลึกวิญญาณ +2':'')+(s+1<STAGES?` · ปลดล็อก ${AREAS[Math.floor((s+1)/10)].n}`:' · จบเนื้อเรื่องหลักแล้ว'),L,btn:'ด่านถัดไป ›',act:'nextStage'}),1300);}
    else{const nxt=s+1;if(S.autoAdv&&nxt<STAGES&&nxt%10!==9&&nxt<=S.best)S.stage=nxt;
      if(S.autoAdv&&nxt%10===9&&!S.firsts[nxt]&&S.stage===s&&nxt<=S.best&&!S.bossHint){S.bossHint=1;toast('ถึงด่านบอสแล้ว กด “ท้าบอส” เมื่อพร้อม');}
      setTimeout(()=>nextWave(),1100);}
  }else{
    const rep=report(why);
    if(was){weekRun();S.stage=Math.max(0,s-1);}else if(s%10>0){S.stage=s-1;}
    banner(why==='time'?'หมดเวลา':'พ่ายแพ้',was?'ถอยกลับไปฟาร์มด่านก่อนหน้า':'ถอยกลับหนึ่งด่าน');
    if(was||!S.seenLoss){S.seenLoss=1;setTimeout(()=>showReport(rep,was),1500);}
    setTimeout(()=>{if(!$('modalRoot').innerHTML)nextWave();},1900);
  }
  save();dirty=true;
}

function towerEnd(win,why){

function renderTower(){

function kTick(){if(!S.k)return;const K=S.k,now=Date.now(),dt=Math.min(OFFCAP(),Math.max(0,(now-K.t)/1000));K.t=now;if(dt<=0)return;
  const p=kProd();for(const r in p)K.res[r]+=p[r]*dt/3600;
  K.acc=(K.acc||0)+kHospRate()*dt/3600;let h=Math.floor(K.acc);if(h>0){K.acc-=h;for(const u of KU){const m=Math.min(h,K.wd[u.k]);K.wd[u.k]-=m;K.tr[u.k]+=m;h-=m;}if(!kWounded())K.acc=0;}}

  return KU.map(u=>({k:u.k,n:K.tr[u.k],hp:u.hp*bm*wm*(1+(g.hp[u.k]||0)/100+(g.allhp||0)/100+(u.k==='sh'?g.shp/100:0)),atk:u.atk*bm*wm*(1+(g.atk[u.k]||0)/100+g.allatk/100),heal:(u.heal||0)*bm*(1+g.heal/100)}));}
const kPow=a=>Math.round(a.reduce((s,x)=>s+x.n*(x.hp*.25+x.atk*2.5+x.heal*2),0));
function kFoe(P,t){const mix=t==='archer'?{sh:.2,ar:.5,mg:.15,sp:.15}:t==='armor'?{sh:.5,ar:.2,mg:.15,sp:.15}:t==='magres'?{sh:.3,ar:.2,mg:.35,sp:.15}:{sh:.3,ar:.3,mg:.2,sp:.2};
  const m=t==='swarm'?.45:t==='boss'?1.6:1;const per=KU.reduce((s,u)=>s+mix[u.k]*(u.hp*.25+u.atk*2.5+(u.heal||0)*2),0)*m,N=P/per;
  return KU.map(u=>({k:u.k,n:Math.max(1,Math.round(N*mix[u.k])),hp:u.hp*m,atk:u.atk*m,heal:(u.heal||0)*m}));}
function kSim(my,foe,trait,defend){
  const mk=a=>a.map(x=>({...x,max:x.n*x.hp,pool:x.n*x.hp,n0:x.n}));const A=mk(my),F=mk(foe),rounds=[];
  const alive=x=>x.pool>0?Math.ceil(x.pool/x.hp-1e-9):0;
  const dmgOf=(side,other,mine)=>{const types=other.filter(x=>x.pool>0).length;let d=0;for(const x of side){const n=alive(x);if(!n)continue;let a=n*x.atk;
      if(x.k==='mg')a*=1+.1*types+(mine&&trait==='swarm'?.6:0);
      if(mine&&trait==='armor'&&(x.k==='ar'||x.k==='sh'))a*=.5;if(mine&&trait==='magres'&&x.k==='mg')a*=.4;d+=a;}return d;};
  const hit=(side,d,pierce)=>{const sh=side.find(x=>x.k==='sh');let toSh=sh.pool>0?d*(1-pierce):0;const rest=d-toSh;
    if(toSh){const t=Math.min(toSh,sh.pool);sh.pool-=t;toSh-=t;}let r=rest+toSh;const back=side.filter(x=>x.k!=='sh'&&x.pool>0);
    if(!back.length){if(sh.pool>0)sh.pool=Math.max(0,sh.pool-r);return;}const tot=back.reduce((s,x)=>s+x.pool,0);back.forEach(x=>{x.pool=Math.max(0,x.pool-r*x.pool/tot);});};
  const heal=side=>{const sp=side.find(x=>x.k==='sp');let h=alive(sp)*sp.heal;if(!h)return;const hurt=side.filter(x=>x.pool>0&&x.pool<x.max);const lost=hurt.reduce((s,x)=>s+x.max-x.pool,0);if(!lost)return;hurt.forEach(x=>{x.pool=Math.min(x.max,x.pool+h*(x.max-x.pool)/lost);});};

async function redeem(raw){const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

  let r=BUILTIN_CODES[code],src='b';
  if(!r&&DB){try{const d=await DB.doc('codes/'+code).get();if(d.exists)r=d.data();src='d';}catch(e){}}
  if(!r){codeMsg(DB?'ไม่พบโค้ดนี้ ตรวจตัวสะกดอีกครั้ง':'ไม่พบโค้ดนี้ (โค้ดพิเศษจากเจ้าของเกมใช้ได้เมื่อเปิดผ่าน claude.ai และเข้าสู่ระบบ)','bad');return;}

  const g=cleanReward(r);if(!Object.keys(g).length){codeMsg('โค้ดนี้ไม่มีรางวัล','bad');return;}
  if(src==='d'&&r.max){const u=await codeUses(code);if(u>=+r.max){codeMsg('โค้ดนี้มีคนใช้ครบจำนวนแล้ว','bad');return;}}

const weekKey=()=>{const d=new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/864e5+1)/7);};

function rollTier(){
  if(S.pSSR>=PITY-1)return 'SSR';
  if(S.pR>=9)return Math.random()*100<3?'SSR':'SR';
  const r=Math.random()*100;return r<RATE.SSR?'SSR':r<RATE.SSR+RATE.SR?'SR':'R';
}
function pullOnce(){const tier=rollTier();const id=pick(POOL[tier]);
  S.pSSR=tier==='SSR'?0:S.pSSR+1;S.pR=tier==='R'?S.pR+1:0;
  const isNew=!S.h[id];let tok=0,cp=0;if(isNew)S.h[id]={lv:1,eq:{w:0,a:0,b:0,c:0}};
  else if(rkOf(id)>=RK_MAX){tok=TOK[tier];S.soul=(S.soul||0)+tok;}else{S.h[id].cp=(S.h[id].cp||0)+1;cp=1;}
  return {id,tier,isNew,tok,cp};}

  const back=[];['healer','mage','ranger'].forEach(r=>{const k=pickR(r,used);if(k){used.push(k);back.push(k);}});
  while(back.length<3){const k=own.find(x=>!used.includes(x)&&HEROES[x].rl!=='knight');if(!k)break;used.push(k);back.push(k);}
  const front=[k1||null,k2||null];if(!k1){const k=own.find(x=>!used.includes(x));if(k){used.push(k);front[0]=k;}}

// ---- team resonance: every owned hero is at least the 5th-highest level
function resLv(){const ls=OWNED().map(k=>S.h[k].lv).sort((a,b)=>b-a);return ls.length>=5?ls.at(4):1;}
function resSync(){const r=resLv();let n=0;for(const k of OWNED())if(S.h[k].lv<r){S.h[k].lv=r;n++;}return n;}
// ---- collection: owned heroes + ranks = team-wide power
const collPct=()=>{const own=OWNED(),rk=own.reduce((a,k)=>a+rkOf(k),0);return {own:own.length,all:ALLH.length,rk,pct:own.length*1+rk*0.25};};
const collMul=()=>1+collPct().pct/100;
const RKCP_LEFT=k=>{let need=0;for(let r=rkOf(k);r<RK_MAX;r++)need+=RK_COPY.at(r);return need;};
const SOUL_PER={R:1,SR:2,SSR:6};
function extraCopies(k){return Math.max(0,(S.h[k].cp||0)-RKCP_LEFT(k));}

      return `<button class="collc ${own?'':'no'} ${H.rar}" data-cact2="hero" data-v="${k}" ${own?'':'disabled'} style="--rc:${RARC[H.rar]}"><span class="cf" style="${own?faceStyle(k):`background-image:url('${cardImg(k)}');background-size:cover`}"></span>
        <b>${own?H.n:'???'}</b><small>${own?`Lv.${S.h[k].lv} · ${rk?rkName(rk):'ยังไม่เลื่อนดาว'}`:H.rar}</small>${own&&S.h[k].cp?`<em>สำเนา ${S.h[k].cp}</em>`:''}${canR?'<i class="cup">▲</i>':''}</button>`;}).join('')}</div>`;}

function dmState(){if(!S.dm||S.dm.day!==dayNo()){let sd=dayNo()*9301+49297;const r=()=>{sd=(sd*233280+1)%2147483647;return sd/2147483647;};
    const pool=Object.keys(DMP).filter(k=>DMP[k].m&&modeOpen(DMP[k].m)&&!(k==='pet'&&!(S.pet&&S.pet.list.length)));const pick=[];
    while(pick.length<2&&pool.length)pick.push(pool.splice(Math.floor(r()*pool.length),1)[0]);const list=['kill','chest',...pick];for(const k of ['lvup','wave'])if(list.length<5)list.push(k);
    S.dm={day:dayNo(),list,c:{},got:{},bonus:false};}return S.dm;}
const dmRw=()=>({gems:20,gold:Math.round(300*(1+S.best/4))});
function dmAdd(k,n){if(!n)return;const D=dmState();if(!D.list.includes(k))return;const was=(D.c[k]||0)>=DMP[k].need;D.c[k]=(D.c[k]||0)+n;if(!was&&D.c[k]>=DMP[k].need)toast(`📋 ภารกิจสำเร็จ: ${DMP[k].n} · กดรับที่ "ไปทำต่อ"`);}
const dmDone=k=>(dmState().c[k]||0)>=DMP[k].need;
function dmClaim(k){const D=dmState();if(D.got[k]||!dmDone(k))return null;D.got[k]=1;const r=dmRw();addRes(r);return r;}
function dmBonus(){const D=dmState();if(D.bonus||!D.list.every(k=>D.got[k]))return null;D.bonus=true;const r={tickets:2,gems:50};addRes(r);return r;}

function claimAll(){const now=Date.now(),b0={gold:S.gold,exp:S.exp,mats:S.mats,gems:S.gems,tickets:S.tickets,soul:S.soul||0},notes=[];
  const el=(now-S.lastClaim)/1000,mins=Math.floor(Math.min(el,OFFCAP())/60);if(el>=600&&mins>0){const p=chestPreview(mins*60);S.gold+=p.g+p.x;S.mats+=p.m;S.lastClaim=el>=OFFCAP()?now:S.lastClaim+mins*60000;S.tutF.chest=1;dmAdd('chest',1);notes.push('🎁 หีบออฟไลน์');}
  if(S.expd){let n=0;for(let i=S.expd.run.length-1;i>=0;i--)if(expClaim(i))n++;if(n)notes.push(`🧭 ทีมสำรวจ ${n} ทีม`);}

    return `<button class="hpin ${P.big?'big':''} ${lock?'lock':''} ${h?'hot':''}" data-hpin="${P.id}" style="left:${P.x}%;top:${P.y}%" aria-label="${P.n}"><span class="hic">${lock?'🔒':P.ic}</span><span class="hlb">${P.n}<small>${lock?'ปลดล็อกด่าน '+sname(UNLK[P.m].lv-1):hSafe(P.sub)}</small></span>${h?'<i class="hdot">!</i>':''}</button>`;}).join('');if($('hPins')._h!==ph){$('hPins').innerHTML=ph;$('hPins')._h=ph;}
  const a=AREAS[Math.min(AREAS.length-1,Math.floor(S.stage/10))];$('hChap').textContent=`บทที่ ${Math.floor(S.stage/10)+1} · ${a?a.n:''}`;
  const hh=hHour();$('hTint').className='htint '+hh;$('hTime').textContent={day:'☀️ กลางวัน',dawn:'🌅 รุ่งเช้า',dusk:'🌇 ยามเย็น',night:'🌙 กลางคืน'}[hh];
  $('hNext').textContent=cl.length||'';$('hNext').parentNode.classList.toggle('has',cl.length>0);
  const T=S.tut<TUT.length?TUT[S.tut]:null,tb=$('hTut');tb.hidden=!T;if(T&&tb._t!==S.tut){tb._t=S.tut;tb.innerHTML=`<img src="${IMG.owl}" alt=""><div><b>บทแนะนำ ${S.tut+1}/${TUT.length} · ${T.t}</b><span>${T.d}</span></div><button class="btn gold sm" data-htut="1">ไปเลย</button>`;}}
document.addEventListener('click',e=>{if(e.target.closest('[data-avopen]')){avPick=null;renderWardrobe(!avState().g);return;}if(e.target.closest('[data-htut]')){const T=TUT[S.tut];if(!T)return;if(T.go==='chest'||T.nav==='boss')go('battle');$('tutGo').click();}});
setInterval(()=>{if(screen==='home'){hPins();}},1500);

requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
if(hWasSeen)setTimeout(()=>go('home'),0);
})();
</script>
